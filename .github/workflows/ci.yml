name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests and syntax checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: >-
          python3 -m pip install --disable-pip-version-check
          -r requirements-downloader.txt -r requirements-monitor.txt

      - name: Run tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check Python syntax
        run: >-
          python3 -m py_compile src/tod-dl.py src/download_telemetry.py
          src/monitor.py src/controller.py src/provenance.py
          src/verify_provenance.py src/acquisition_evaluation.py

      - name: Check Bash syntax
        run: bash -n ./run.sh

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
